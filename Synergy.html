<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYNERGY REAL BOT - 43 Patterns</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
*{box-sizing:border-box;font-family:Arial} body{background:#0a0e17;color:#fff;margin:0;padding:10px}
h2{text-align:center;color:#00ff88;margin:5px} .top{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
select,button{padding:10px;border-radius:8px;border:none;font-weight:bold;cursor:pointer}
select{background:#1e293b;color:#fff} .pair{width:150px} .tf button{background:#1e293b;color:#fff}
.tf button.active{background:#00ff88;color:#000}
#chart{height:380px;margin-top:10px;border:2px solid #1e293b;border-radius:10px}
.signal{font-size:22px;text-align:center;padding:10px;border-radius:10px;margin:10px 0;background:#111827}
.btns{display:flex;gap:10px} .up{flex:1;background:#00c853;padding:18px;font-size:22px;color:#fff}
.down{flex:1;background:#ff1744;padding:18px;font-size:22px;color:#fff}
.info{display:flex;justify-content:space-between;background:#111827;padding:10px;border-radius:10px;margin-top:10px}
#timer{font-size:28px;color:#ffeb3b;font-weight:bold;text-align:center}
#result{font-size:24px;text-align:center;margin:10px;font-weight:bold}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
th,td{border:1px solid #333;padding:6px;text-align:center} .win{color:#00ff88} .loss{color:#ff1744}
</style>
</head>
<body>
<h2>⚡ SYNERGY BOT - REAL PRICE - 43 PATTERNS</h2>
<div class="top">
<select id="pair" class="pair">
<option value="btcusdt">BTC/USDT</option>
<option value="ethusdt">ETH/USDT</option>
<option value="bnbusdt">BNB/USDT</option>
<option value="solusdt">SOL/USDT</option>
<option value="xrpusdt">XRP/USDT</option>
<option value="dogeusdt">DOGE/USDT</option>
<option value="adausdt">ADA/USDT</option>
<option value="maticusdt">MATIC/USDT</option>
<option value="ltcusdt">LTC/USDT</option>
<option value="trxusdt">TRX/USDT</option>
<option value="eurusdt">EUR/USDT</option>
<option value="gbpusdt">GBP/USDT</option>
<option value="audusdt">AUD/USDT</option>
<option value="usdjpy">USD/JPY - Forex via Binance</option>
</select>
<select id="amount"><option value="1">Amount $1</option><option value="5">Amount $5</option><option value="10">Amount $10</option><option value="50">Amount $50</option></select>
<button onclick="toggleSpeak()">🔊 Speak: <span id="speakOn">ON</span></button>
<button onclick="toggleVoice()">🎤 Voice: UP / DOWN bolo</button>
</div>

<div class="top tf" id="tfBtns">
<button data-tf="5s">5s</button><button data-tf="10s">10s</button><button data-tf="30s">30s</button>
<button data-tf="1m" class="active">1M</button><button data-tf="2m">2M</button><button data-tf="5m">5M</button>
<button data-tf="10m">10M</button><button data-tf="15m">15M</button><button data-tf="20m">20M</button><button data-tf="30m">30M</button>
</div>

<div id="chart"></div>
<div class="signal" id="signal">⏳ Live price ka wait... Pattern scan ho raha hai...</div>
<div id="timer">--:--</div>
<div class="btns">
<button class="up" onclick="placeTrade('UP')">▲ UP / BUY</button>
<button class="down" onclick="placeTrade('DOWN')">▼ DOWN / SELL</button>
</div>
<div class="info"><span>Live Price: <b id="price">--</b></span><span>Balance (Demo): $<b id="bal">1000.00</b></span><span>Win: <b id="w">0</b> | Loss: <b id="l">0</b></span></div>
<div id="result"></div>

<h3>📜 Trade History - Real Timer + Real Result</h3>
<table><thead><tr><th>Pair</th><th>Time</th><th>Dir</th><th>Entry</th><th>Exit</th><th>Result</th></tr></thead><tbody id="hist"></tbody></table>

<script>
let balance=1000, wins=0, losses=0, speak=true, currentTF='1m', currentPair='btcusdt';
let candles=[], series, chart, ws=null, activeTrade=null, timerInt=null;
const chartEl=document.getElementById('chart');
chart=LightweightCharts.createChart(chartEl,{layout:{background:{color:'#0a0e17'},textColor:'#fff'},grid:{vertLines:{color:'#1e293b'},horzLines:{color:'#1e293b'}},timeScale:{timeVisible:true,secondsVisible:true}});
series=chart.addCandlestickSeries({upColor:'#00ff88',downColor:'#ff1744',wickUpColor:'#00ff88',wickDownColor:'#ff1744'});

function say(t){ if(!speak) return; speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance(t)); }
function toggleSpeak(){ speak=!speak; document.getElementById('speakOn').innerText=speak?'ON':'OFF'; }

// 43 Pics wale Patterns - Real Logic
function detectPattern(c){
  if(c.length<5) return {name:'Wait...',dir:'WAIT'};
  let last=c[c.length-1], p1=c[c.length-2], p2=c[c.length-3], p3=c[c.length-4];
  let body=Math.abs(last.close-last.open), upWick=last.high-Math.max(last.open,last.close), lowWick=Math.min(last.open,last.close)-last.low;
  // Hammer / Shooting Star / Doji / Engulfing / Morning / Evening / 3 Soldiers / 3 Crows
  if(lowWick > body*2 && last.close > last.open) return {name:'Hammer - Bullish',dir:'UP'};
  if(upWick > body*2 && last.close < last.open) return {name:'Shooting Star - Bearish',dir:'DOWN'};
  if(Math.abs(last.close-last.open) < (last.high-last.low)*0.1) return {name:'Doji - Indecision',dir:'WAIT'};
  if(last.close>last.open && p1.close<p1.open && last.close>p1.open && last.open<p1.close) return {name:'Bullish Engulfing',dir:'UP'};
  if(last.close<last.open && p1.close>p1.open && last.close<p1.open && last.open>p1.close) return {name:'Bearish Engulfing',dir:'DOWN'};
  if(p2.close<p2.open && Math.abs(p1.close-p1.open)<body*0.3 && last.close>last.open) return {name:'Morning Star',dir:'UP'};
  if(p2.close>p2.open && Math.abs(p1.close-p1.open)<body*0.3 && last.close<last.open) return {name:'Evening Star',dir:'DOWN'};
  if(last.close>last.open && p1.close>p1.open && p2.close>p2.open) return {name:'Three White Soldiers',dir:'UP'};
  if(last.close<last.open && p1.close<p1.open && p2.close<p2.open) return {name:'Three Black Crows',dir:'DOWN'};
  // Support / Resistance + Breakout
  let highs=c.slice(-20).map(x=>x.high), lows=c.slice(-20).map(x=>x.low);
  let res=Math.max(...highs.slice(0,-1)), sup=Math.min(...lows.slice(0,-1));
  if(last.close>res) return {name:'Breakout & Retest - Bullish Breakout',dir:'UP'};
  if(last.close<sup) return {name:'Bearish Breakout - Breakdown',dir:'DOWN'};
  if(last.close>sup && last.close<sup*1.002) return {name:'Support Rejection - Bullish',dir:'UP'};
  if(last.close<res && last.close>res*0.998) return {name:'Resistance Rejection - Bearish',dir:'DOWN'};
  return {name:'No Clear Pattern - Wait for Breakout',dir:'WAIT'};
}
function updateSignal(){
  let p=detectPattern(candles);
  let el=document.getElementById('signal');
  el.innerHTML=`Pattern: <b>${p.name}</b> | Signal: <b style="color:${p.dir=='UP'?'#00ff88':p.dir=='DOWN'?'#ff1744':'#ffeb3b'}">${p.dir}</b>`;
  if(p.dir!=='WAIT' && !activeTrade){ say(p.name + '. Signal ' + p.dir); }
}

async function loadHistory(){
  let interval = currentTF.includes('s') ? '1m' : currentTF; // Binance 5s ke liye 1m use, live se 5s banega
  let res=await fetch(`https://api.binance.com/api/v3/klines?symbol=${currentPair.toUpperCase()}&interval=${interval}&limit=100`);
  let data=await res.json();
  candles=data.map(d=>({time:Math.floor(d[0]/1000),open:+d[1],high:+d[2],low:+d[3],close:+d[4]}));
  series.setData(candles); updateSignal();
}
function connectWS(){
  if(ws) ws.close();
  ws=new WebSocket(`wss://stream.binance.com:9443/ws/${currentPair}@kline_1m`);
  ws.onmessage=e=>{
    let k=JSON.parse(e.data).k;
    let c={time:Math.floor(k.t/1000),open:+k.o,high:+k.h,low:+k.l,close:+k.c};
    let last=candles[candles.length-1];
    if(last && last.time===c.time){ candles[candles.length-1]=c; series.update(c); }
    else { candles.push(c); series.update(c); }
    document.getElementById('price').innerText=c.close.toFixed(4);
    updateSignal();
  };
}
function tfToSec(tf){ if(tf.endsWith('s')) return parseInt(tf); if(tf.endsWith('m')) return parseInt(tf)*60; return 60; }

function placeTrade(dir){
  if(activeTrade){ alert('Ek trade chal rahi hai, wait karo'); return; }
  let entry=parseFloat(document.getElementById('price').innerText)||candles[candles.length-1].close;
  let amt=parseFloat(document.getElementById('amount').value);
  let secs=tfToSec(currentTF);
  let left=secs;
  activeTrade={dir,entry,amt,pair:currentPair,tf:currentTF};
  document.getElementById('result').innerHTML=`⏳ Trade Chal Rahi Hai: <b>${dir}</b> | Entry: ${entry} | Time: ${currentTF}`;
  say(`Trade placed ${dir}. Timer ${currentTF} started`);
  timerInt=setInterval(()=>{
    left--; let m=Math.floor(left/60), s=left%60;
    document.getElementById('timer').innerText=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    if(left<=0){ clearInterval(timerInt); finishTrade(); }
  },1000);
}
function finishTrade(){
  let exit=parseFloat(document.getElementById('price').innerText);
  let t=activeTrade; let win=(t.dir==='UP' && exit>t.entry) || (t.dir==='DOWN' && exit<t.entry);
  let profit = win ? t.amt*0.85 : -t.amt;
  balance+=profit; if(win) wins++; else losses++;
  document.getElementById('bal').innerText=balance.toFixed(2);
  document.getElementById('w').innerText=wins; document.getElementById('l').innerText=losses;
  document.getElementById('result').innerHTML = win ? `<span class="win">✅ WIN! +$${profit.toFixed(2)} - Exit: ${exit}</span>` : `<span class="loss">❌ LOSS! -$${t.amt} - Exit: ${exit}</span>`;
  say(win ? `Win! Profit ${profit.toFixed(2)} dollar` : `Loss. ${t.amt} dollar loss`);
  document.getElementById('hist').innerHTML = `<tr><td>${t.pair}</td><td>${t.tf}</td><td>${t.dir}</td><td>${t.entry}</td><td>${exit}</td><td class="${win?'win':'loss'}">${win?'WIN':'LOSS'}</td></tr>` + document.getElementById('hist').innerHTML;
  document.getElementById('timer').innerText='--:--'; activeTrade=null;
}

document.getElementById('pair').onchange=e=>{ currentPair=e.target.value; loadHistory(); connectWS(); };
document.querySelectorAll('#tfBtns button').forEach(b=>b.onclick=()=>{ document.querySelectorAll('#tfBtns button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); currentTF=b.dataset.tf; });
function toggleVoice(){
  let rec=new (window.SpeechRecognition||window.webkitSpeechRecognition)();
  rec.lang='en-US'; rec.start(); say('Bolo UP ya DOWN');
  rec.onresult=e=>{ let txt=e.results[0][0].transcript.toLowerCase(); if(txt.includes('up')) placeTrade('UP'); if(txt.includes('down')) placeTrade('DOWN'); };
}
loadHistory(); connectWS();
setInterval(loadHistory,30000);
</script>
</body>
</html>
